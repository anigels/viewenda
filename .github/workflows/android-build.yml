name: Build Android App

on:
  workflow_dispatch:
    inputs:
      upload_to_store:
        description: 'Upload this signed build to Google Play internal testing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest

    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate release configuration
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
          UPLOAD_TO_STORE: ${{ inputs.upload_to_store }}
          BUILD_REF: ${{ github.ref }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: node scripts/check-mobile-release.mjs android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Validate app
        run: npm run typecheck && npm test

      - name: Build native assets
        run: npm run build:native
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set version and build number
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          BUILD_NUMBER="${{ github.run_number }}"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Setting version: $APP_VERSION, build: $BUILD_NUMBER"

      - name: Update Android version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ env.BUILD_NUMBER }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ env.APP_VERSION }}\"/" android/app/build.gradle
          echo "Android version:"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/keystore.jks"
          echo -n "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Viewenda-Android-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

      - name: Prepare Google Play service account
        if: inputs.upload_to_store && github.ref == 'refs/heads/main'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          SA_PATH="$RUNNER_TEMP/google-play-service-account.json"

          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$SA_PATH"
          elif [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$SA_PATH"
          else
            echo "HAS_PLAY_CREDENTIALS=false" >> $GITHUB_ENV
            echo "Google Play credentials not configured; upload step will be skipped."
            exit 0
          fi

          python -m json.tool "$SA_PATH" > /dev/null
          echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH=$SA_PATH" >> $GITHUB_ENV
          echo "HAS_PLAY_CREDENTIALS=true" >> $GITHUB_ENV

      - name: Upload to Google Play
        if: inputs.upload_to_store && github.ref == 'refs/heads/main' && env.HAS_PLAY_CREDENTIALS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH }}
          packageName: com.anigels.viewenda
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: Skip Play upload (no service account secret)
        if: inputs.upload_to_store && github.ref == 'refs/heads/main' && env.HAS_PLAY_CREDENTIALS != 'true'
        run: |
          echo "Google Play upload skipped: no service account secret configured."

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks" "$RUNNER_TEMP/google-play-service-account.json"
